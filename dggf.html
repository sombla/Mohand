<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم - موقع إخباري</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        .sidebar {
            background: linear-gradient(145deg, #1a4d2a, #4a785e);
            width: 250px;
            height: 100vh;
            padding: 20px;
            position: fixed;
            color: #fff;
        }

        .logo {
            font-size: 24px;
            margin-bottom: 40px;
            text-align: center;
            color: #e9f5eb;
            border-bottom: 2px solid #83b692;
            padding-bottom: 15px;
        }

        .nav-menu {
            list-style: none;
        }

        .nav-item {
            margin: 15px 0;
            padding: 12px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .nav-item:hover {
            background: #2d6a4f;
            cursor: pointer;
        }

        .nav-item.active {
            background: #83b692;
            color: #1a4d2a;
            font-weight: bold;
        }

        .nav-link {
            color: inherit;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-link i {
            width: 25px;
            font-size: 18px;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 70px;
            }
            .nav-link span {
                display: none;
            }
            .logo span {
                display: none;
            }
        }
    </style>
    <!-- رابط أيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <i class="fas fa-leaf"></i>
            <span>الموقع الإخباري</span>
        </div>
        
        <ul class="nav-menu">
            <li class="nav-item active">
                <a href="#" class="nav-link">
                    <i class="fas fa-home"></i>
                    <span>الرئيسية</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">
                    <i class="fas fa-newspaper"></i>
                    <span>أخبار</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">
                    <i class="fas fa-chart-line"></i>
                    <span>اقتصاد</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">
                    <i class="fas fa-search"></i>
                    <span>التحقيقات والحوارات</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">
                    <i class="fas fa-file-alt"></i>
                    <span>تقارير</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">
                    <i class="fas fa-palette"></i>
                    <span>المنوعات والثقافة</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">
                    <i class="fas fa-futbol"></i>
                    <span>رياضية</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">
                    <i class="fas fa-heartbeat"></i>
                    <span>صحة ومجتمع</span>
                </a>
            </li>
        </ul>
    </div>
</body>
</html>
